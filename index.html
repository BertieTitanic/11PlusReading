<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>11+ Reading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,650;1,7..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF3F8; --card:#FFFFFF; --ink:#172238; --muted:#56637A; --rule:#CFD9E5;
  --accent:#2B55C9; --accent-ink:#FFFFFF; --hl:#FFE24D; --pick:#D6E2FF;
  --good:#17784D; --good-bg:#DCF2E6; --bad:#B8322F; --bad-bg:#FBE2E1;
  --ui:"Lexend", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --serif:"Literata", Georgia, "Times New Roman", serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111722; --card:#1A2231; --ink:#E7ECF4; --muted:#9BA7BA; --rule:#2E3A4D;
    --accent:#7FA0FF; --accent-ink:#0E1420; --hl:rgba(255,226,77,.35); --pick:rgba(127,160,255,.28);
    --good:#5DD39A; --good-bg:#16352A; --bad:#FF8A85; --bad-bg:#3B1C1C;
  }
}
:root[data-theme="dark"]{
  --paper:#111722; --card:#1A2231; --ink:#E7ECF4; --muted:#9BA7BA; --rule:#2E3A4D;
  --accent:#7FA0FF; --accent-ink:#0E1420; --hl:rgba(255,226,77,.35); --pick:rgba(127,160,255,.28);
  --good:#5DD39A; --good-bg:#16352A; --bad:#FF8A85; --bad-bg:#3B1C1C;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:1.02rem;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none !important}

#app{min-height:100%;display:flex;flex-direction:column;max-width:1100px;margin:0 auto}
#app.fixed{height:100%;min-height:0}
.top{display:flex;align-items:center;gap:.6rem;padding:.6rem .9rem}
.top h1{font-family:var(--serif);font-weight:650;font-size:1.25rem;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{flex:none;border:1.5px solid var(--rule);background:var(--card);border-radius:12px;min-height:44px;padding:0 .8rem;cursor:pointer;font-size:.92rem}
.fsbtn{flex:none;width:44px;height:44px;display:grid;place-items:center;background:var(--card);border:1.5px solid var(--rule);border-radius:12px;cursor:pointer}
.fsbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.fsbtn .out{display:none} .fsbtn.on .in{display:none} .fsbtn.on .out{display:block}
.back:hover,.fsbtn:hover{border-color:var(--accent)}

/* ---------- home ---------- */
#home{padding:0 .9rem 2rem;max-width:720px;width:100%;margin:0 auto}
.homebar{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center;justify-content:space-between;margin:.3rem 0 1rem}
.seg{display:inline-flex;flex-wrap:wrap;align-items:center;max-width:100%;border:1.5px solid var(--rule);border-radius:12px;padding:3px;background:var(--card)}
.seg .lbl{padding:0 .5rem 0 .6rem;font-size:.92rem;color:var(--muted)}
.seg button{border:0;background:none;padding:.5rem .3rem;min-width:2.6rem;border-radius:9px;cursor:pointer;color:var(--muted);min-height:40px}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);font-weight:600;box-shadow:0 0 0 1.5px var(--accent) inset}
.switch{display:flex;align-items:center;gap:.55rem;cursor:pointer;font-size:.92rem;color:var(--muted);background:none;border:0;padding:.3rem 0}
.switch .track{width:2.6rem;height:1.5rem;border-radius:1rem;background:var(--rule);position:relative;flex:none;transition:background .2s}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:1.1rem;height:1.1rem;border-radius:50%;background:var(--card);transition:transform .2s}
.switch[aria-checked="true"] .track{background:var(--accent)}
.switch[aria-checked="true"] .track::after{transform:translateX(1.1rem)}
.cards{display:grid;gap:.75rem}
.pcard{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--rule);border-radius:16px;padding:1rem 1.1rem;cursor:pointer}
.pcard:hover{border-color:var(--accent)}
.pcard .t{font-family:var(--serif);font-weight:650;font-size:1.3rem;line-height:1.25;display:block}
.pcard .s{color:var(--muted);font-size:.9rem;display:block;margin-top:.2rem}
.pcard .b{display:inline-block;margin-top:.6rem;font-size:.88rem;padding:.15rem .6rem;border-radius:999px;background:var(--paper);color:var(--muted)}
.pcard .b.done{background:var(--good-bg);color:var(--good)}
.pcard .tagb{display:inline-block;margin:0 0 .35rem;font-size:.8rem;font-weight:600;padding:.1rem .55rem;border-radius:999px;background:var(--pick);color:var(--accent)}
.hint{color:var(--muted);font-size:.9rem;margin:1.2rem .2rem 0}

/* ---------- reading ---------- */
#read{flex:1;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:0}
.pane{overflow:auto;-webkit-overflow-scrolling:touch;padding:.2rem .9rem 1.2rem;overscroll-behavior:contain}
.intro{font-size:.92rem;color:var(--muted);background:var(--card);border:1.5px solid var(--rule);border-radius:12px;padding:.6rem .8rem;margin:0 0 1rem}
.text{font-family:var(--serif);font-size:1.08rem;line-height:1.75;max-width:40rem}
.text p{margin:0 0 .9em}
.text p.cut{color:var(--muted);text-align:center;letter-spacing:.1em}
.src{font-size:.85rem;color:var(--muted);margin-top:.6rem;font-style:italic}
.s{border-radius:4px;transition:background .15s;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:.05em 0}
.picking .s{cursor:pointer;background:linear-gradient(transparent 92%, var(--rule) 92%)}
.picking .s:hover{background:var(--pick)}
.s.picked{background:var(--pick) !important;box-shadow:0 0 0 2px var(--accent)}
.s.ev{background:var(--hl) !important}
.s.wrongpick{box-shadow:0 0 0 2px var(--bad)}

.panel{background:var(--card);border-top:1.5px solid var(--rule);padding:.9rem .9rem 1rem;overflow:auto;max-height:62vh;box-shadow:0 -6px 18px rgba(23,34,56,.06)}
.meta{display:flex;align-items:center;justify-content:space-between;gap:.5rem;font-size:.88rem;color:var(--muted);margin-bottom:.4rem}
.pill{border:1.5px solid var(--rule);border-radius:999px;padding:.05rem .6rem;font-size:.82rem}
.q{font-family:var(--serif);font-weight:650;font-size:1.15rem;line-height:1.4;margin:0 0 .75rem}
.opts{display:grid;gap:.5rem}
.opt{display:flex;gap:.7rem;align-items:flex-start;text-align:left;width:100%;background:var(--card);border:2px solid var(--rule);border-radius:12px;padding:.7rem .8rem;cursor:pointer;font-size:1rem;line-height:1.4}
.opt:hover:not(:disabled):not(.static){border-color:var(--accent)}
.opt .k{flex:none;width:1.6rem;height:1.6rem;border-radius:50%;border:1.5px solid var(--rule);display:grid;place-items:center;font-size:.8rem;color:var(--muted);margin-top:.05rem}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--good);background:var(--good-bg)}
.opt.incorrect{border-color:var(--bad);background:var(--bad-bg)}
.opt.dim{opacity:.5}
.recap{font-family:var(--serif);font-weight:650;font-size:1.02rem;line-height:1.4;margin:0 0 .6rem;padding-left:.7rem;border-left:3px solid var(--accent)}
details.review{margin:0 0 .8rem;border:1.5px solid var(--rule);border-radius:12px;padding:0 .8rem}
details.review summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-size:.92rem;font-weight:500;color:var(--accent);list-style:none}
details.review summary::-webkit-details-marker{display:none}
details.review summary::before{content:"";width:.5rem;height:.5rem;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);margin:0 .7rem 0 .15rem;transition:transform .15s}
details.review[open] summary::before{transform:rotate(45deg)}
details.review .opts{padding:0 0 .8rem}
details.review *{box-sizing:border-box}
.opt.static{cursor:default}
.opt .tag{display:block;font-size:.8rem;font-weight:600;margin-top:.15rem}
.opt.correct .tag{color:var(--good)} .opt.incorrect .tag{color:var(--bad)}
.qlist details.review{margin:.1rem 0 0}
.qlist .ans{font-size:.92rem;margin:0 0 .5rem}
.qlist .ans b{font-weight:600}
.mine{font-size:.92rem;color:var(--muted);margin:0 0 .6rem}
.mine b{color:var(--ink);font-weight:500}
.instr{font-weight:600;margin:.2rem 0 .7rem}
.verdict{font-weight:600;margin:.1rem 0 .3rem}
.verdict.good{color:var(--good)} .verdict.bad{color:var(--bad)}
.why{margin:0 0 .7rem;font-size:.97rem}
.why .lbl{display:block;font-size:.88rem;color:var(--muted)}
.why .lbl.strong{color:var(--ink);font-weight:600;font-size:.97rem}
.verdicts{display:flex;flex-wrap:wrap;gap:.4rem;margin:.1rem 0 .7rem}
.vp{font-size:.88rem;font-weight:600;border-radius:999px;padding:.2rem .7rem}
.vp.y{background:var(--good-bg);color:var(--good)} .vp.n{background:var(--bad-bg);color:var(--bad)}
.evnote{font-size:.88rem;color:var(--muted);margin:0}
.panel .btnrow{position:sticky;bottom:-1rem;background:var(--card);margin:0 -.9rem -1rem;padding:.7rem .9rem 1rem}
#startRow{margin-top:1.2rem}
.res .btnrow{flex-direction:column-reverse}
.res .btnrow button{width:100%}
.btnrow{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.8rem}
.primary{flex:1;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:.8rem 1.2rem;font-weight:600;cursor:pointer;min-height:48px;font-size:1.02rem}
.primary:disabled{opacity:.45;cursor:default}
.secondary{background:var(--card);border:1.5px solid var(--rule);border-radius:12px;padding:.75rem 1.1rem;cursor:pointer;min-height:48px}

/* ---------- results ---------- */
#done{padding:0 .9rem 2rem;max-width:720px;width:100%;margin:0 auto}
.res{background:var(--card);border:1.5px solid var(--rule);border-radius:16px;padding:1.3rem 1.1rem}
.res .big{font-family:var(--serif);font-weight:650;font-size:2.4rem;margin:.1rem 0 .2rem}
.res .sub{color:var(--muted);margin:0}
.qlist{list-style:none;padding:0;margin:1.1rem 0 0;display:grid;gap:.45rem}
.qlist li{display:flex;flex-direction:column;gap:.35rem;border-top:1px solid var(--rule);padding-top:.5rem;font-size:.95rem}
.marks{flex:none;display:flex;gap:.25rem}
.mk{font-size:.75rem;border-radius:6px;padding:.1rem .35rem;font-weight:600}
.mk.y{background:var(--good-bg);color:var(--good)} .mk.n{background:var(--bad-bg);color:var(--bad)}

@media (min-width:900px){
  #read{grid-template-rows:none;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:1rem;padding:0 .9rem 1rem}
  .pane{padding:.2rem .4rem 1rem 0}
  .panel{max-height:none;border:1.5px solid var(--rule);border-radius:16px;box-shadow:none;align-self:start;max-height:100%}
}
@media (max-width:420px){
  .top h1{font-size:1.05rem}
  .text{font-size:1.02rem;line-height:1.7}
  .q{font-size:1.05rem}
  .opt{font-size:.95rem;padding:.6rem .7rem}
}
@media (prefers-reduced-motion: reduce){ .s,.switch .track,.switch .track::after,details.review summary::before{transition:none} }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button class="back" id="backBtn" type="button" hidden>‹ Back</button>
    <h1 id="title">11+ Reading</h1>
    <button class="fsbtn" id="fsBtn" type="button" aria-label="Full screen" title="Full screen" hidden>
      <svg class="in" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      <svg class="out" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
    </button>
  </header>

  <section id="home">
    <div class="homebar">
      <div class="seg" role="group" aria-label="Week" id="weekSeg"></div>
      <button class="switch" id="evSwitch" type="button" role="switch" aria-checked="true"><span class="track"></span>Find the evidence</button>
    </div>
    <div class="cards" id="cards"></div>
    <p class="hint" id="hint"></p>
  </section>

  <section id="read" hidden>
    <div class="pane" id="pane">
      <p class="intro" id="intro"></p>
      <div class="text" id="text"></div>
      <p class="src" id="src"></p>
      <div class="btnrow" id="startRow"><button class="primary" id="startBtn" type="button"></button></div>
    </div>
    <div class="panel" id="panel" aria-live="polite"></div>
  </section>

  <section id="done" hidden></section>
</div>

<script>
// ================= PASSAGES =================
// Each passage belongs to a week. Text is a list of paragraphs; each paragraph is a list of sentences.
// The word "cut" on its own marks where part of an extract has been left out (shown as […]).
// Wrap a word in *stars* to show it in italics.
//
// Each question has four options. Mark the right one with  correct: true .
// "why" is the feedback shown for that option.
// "evidence" lists short phrases copied exactly from the text. Any sentence containing one of
// these phrases counts as good evidence. Each phrase must appear in only one sentence.

const PASSAGES = [

// ---------------------------------------------------------------- Week 1
{
  week: 1,
  title: `The Mole Learns to Row`,
  source: `From The Wind in the Willows by Kenneth Grahame (1908)`,
  intro: `The Mole has just met the Water Rat, and they have spent the day on the river. The Mole has never been in a boat before.`,
  text: [
    [`The afternoon sun was getting low as the Rat sculled gently homewards in a dreamy mood, murmuring poetry-things over to himself, and not paying much attention to Mole.`,
     `But the Mole was very full of lunch, and self-satisfaction, and pride, and already quite at home in a boat (so he thought), and was getting a bit restless besides: and presently he said, "Ratty! Please, *I* want to row, now!"`],
    [`The Rat shook his head with a smile.`,
     `"Not yet, my young friend," he said; "wait till you've had a few lessons.`,
     `It's not so easy as it looks."`],
    [`The Mole was quiet for a minute or two.`,
     `But he began to feel more and more jealous of Rat, sculling so strongly and so easily along, and his pride began to whisper that he could do it every bit as well.`,
     `He jumped up and seized the sculls so suddenly that the Rat, who was gazing out over the water and saying more poetry-things to himself, was taken by surprise and fell backwards off his seat with his legs in the air for the second time, while the triumphant Mole took his place and grabbed the sculls with entire confidence.`],
    [`The Mole flung his sculls back with a flourish, and made a great dig at the water.`,
     `He missed the surface altogether, his legs flew up above his head, and he found himself lying on the top of the prostrate Rat.`,
     `Greatly alarmed, he made a grab at the side of the boat, and the next moment—Sploosh!`,
     `Over went the boat, and he found himself struggling in the river.`],
    "cut",
    [`Then a firm paw gripped him by the back of his neck.`,
     `It was the Rat, and he was evidently laughing—the Mole could *feel* him laughing, right down his arm and through his paw, and so into his—the Mole's—neck.`],
    "cut",
    [`When all was ready for a start once more, the Mole, limp and dejected, took his seat in the stern of the boat; and as they set off, he said in a low voice, broken with emotion, "Ratty, my generous friend! I am very sorry indeed for my foolish and ungrateful conduct.`,
     `My heart quite fails me when I think how I might have lost that beautiful luncheon-basket. […]`,
     `Will you overlook it this once and forgive me, and let things go on as before?"`],
    [`"That's all right, bless you!" responded the Rat cheerily.`,
     `"What's a little wet to a Water Rat?`,
     `I'm more in the water than out of it most days.`,
     `Don't you think any more about it; and look here! I really think you had better come and stop with me for a little time."`],
    [`The Mole was so touched by his kind manner of speaking that he could find no voice to answer him; and he had to brush away a tear or two with the back of his paw.`,
     `But the Rat kindly looked in another direction, and presently the Mole's spirits revived again.`],
  ],
  questions: [
    {
      type: `Character`,
      q: `The words "(so he thought)" in the second sentence suggest that…`,
      options: [
        { text: `the Mole is not as good at boating as he believes.`, correct: true, why: `The brackets are the writer hinting that the Mole is wrong, and the boat tipping over proves it.` },
        { text: `the Mole has been in boats many times before.`, why: `Nothing in the text says this, and the way the Mole behaves suggests he is new to boats.` },
        { text: `the Mole is very full of lunch.`, why: `The text does say this, but the brackets are not about lunch. They comment on how good the Mole thinks he is in a boat.` },
        { text: `the Rat agrees the Mole is ready to row.`, why: `The opposite: the Rat says "Not yet".` },
      ],
      evidence: [`so he thought`, `He missed the surface altogether`, `Over went the boat`],
    },
    {
      type: `Feelings`,
      q: `How does the Rat feel when the Mole first asks to row?`,
      options: [
        { text: `Amused, but sure the Mole isn't ready yet.`, correct: true, why: `He smiles, so he isn't cross, but he still says "Not yet" and talks about lessons.` },
        { text: `Angry that the Mole interrupted his poetry.`, why: `He was murmuring poetry, but he answers with a smile, not anger.` },
        { text: `Worried the Mole will damage his boat.`, why: `That would be a sensible worry, but the text never says he feels it.` },
        { text: `Dreamy and not paying attention.`, why: `The first sentence says this about him before the Mole asks. It isn't his reaction to the request.` },
      ],
      evidence: [`shook his head with a smile`, `Not yet, my young friend`, `not so easy as it looks`],
    },
    {
      type: `Word meaning`,
      q: `The Mole is described as "limp and dejected". What does "dejected" mean here?`,
      options: [
        { text: `Sad and low in spirits`, correct: true, why: `His "low voice, broken with emotion" in the same sentence shows he is unhappy.` },
        { text: `Soaking wet`, why: `The Mole is wet, which makes this tempting, but the clues in the sentence are about his feelings.` },
        { text: `Badly injured`, why: `Nothing in the text suggests he is hurt.` },
        { text: `Tired out`, why: `Close to "limp", but the clues around "dejected" are about emotion, not tiredness.` },
      ],
      evidence: [`limp and dejected`],
    },
    {
      type: `Motive`,
      q: `Why does the Mole say his heart "fails" him when he thinks how he "might have lost that beautiful luncheon-basket"?`,
      options: [
        { text: `He feels worse about the trouble he caused the Rat than about nearly drowning himself.`, correct: true, why: `The basket is the Rat's, and the Mole calls his own behaviour "foolish and ungrateful". There is gentle humour here too: he nearly drowned, yet he frets about the picnic basket.` },
        { text: `He is still hungry.`, why: `"Luncheon-basket" might make you think of food, but nothing shows he is hungry.` },
        { text: `The basket has been lost in the river for ever.`, why: `Read carefully: he *might have* lost it. "When all was ready for a start once more" shows things were recovered.` },
        { text: `He thinks the Rat will make him pay for it.`, why: `The Rat never mentions this, and his cheerful reply shows he isn't bothered.` },
      ],
      evidence: [`foolish and ungrateful`, `beautiful luncheon-basket`],
    },
    {
      type: `Motive`,
      q: `Why does the Rat look "in another direction" at the end?`,
      options: [
        { text: `So the Mole won't feel embarrassed about crying.`, correct: true, why: `The Mole is brushing away tears, and the word "kindly" shows the Rat looks away on purpose to be considerate.` },
        { text: `He is watching where the boat is going.`, why: `That sounds sensible, but the text links his action to kindness, not steering.` },
        { text: `He is bored of the Mole's apology.`, why: `The opposite: "kindly" and his cheerful reply show he cares.` },
        { text: `He is looking for the luncheon-basket.`, why: `Everything was already "ready for a start once more".` },
      ],
      evidence: [`brush away a tear`, `kindly looked in another direction`],
    },
    {
      type: `Character`,
      q: `Which word best describes the Rat in this extract?`,
      options: [
        { text: `Forgiving`, correct: true, why: `He tells the Mole not to think any more about it and even invites him to stay.` },
        { text: `Strict`, why: `He does say "Not yet", but with a smile, and he isn't strict afterwards.` },
        { text: `Careless`, why: `He wasn't paying attention at the start, but that is one moment, not what he is like overall.` },
        { text: `Proud`, why: `Pride belongs to the Mole in this extract, not the Rat.` },
      ],
      evidence: [`That's all right, bless you`, `What's a little wet`, `Don't you think any more about it`],
    },
  ],
},

{
  week: 1,
  title: `The Allotment`,
  source: `An original story written for this game`,
  intro: `Leo is helping his grandad on his allotment, a small plot of land where he grows vegetables.`,
  text: [
    [`Grandad worked at a brisk pace that morning, glancing up every few minutes at the ominous grey clouds piling up behind the church tower.`,
     `Leo trailed behind him with the basket, sluggish and silent.`,
     `He had wanted to stay at home and finish his game.`],
    [`By eleven o'clock the basket was heavy with the reddest, plumpest tomatoes Leo had ever seen.`,
     `"These are for the show on Saturday," he thought.`,
     `"We'll win for certain."`],
    [`At the end of the path they passed Mrs Okafor's plot.`,
     `Last week it had been a jungle of green.`,
     `Now the stalks lay flat and blackened, and a torn net flapped against her shed.`],
    [`Grandad stopped.`,
     `He looked at the ruined plants for a long moment, then at Leo, then at the basket.`],
    [`"Grandad, no," Leo whispered.`],
    [`But Grandad was already knocking on the shed door.`,
     `When he came back, the basket was half empty, and he was humming.`],
    [`Leo kicked a stone all the way to the car.`,
     `Grandad said nothing.`,
     `He simply waited until they reached the gate, then put a hand on Leo's shoulder.`],
    [`"There'll be other shows," he said.`,
     `"There's only one Mrs Okafor."`],
    [`The first fat drops of rain began to fall.`],
  ],
  questions: [
    {
      type: `Motive`,

// ================= GAME =================
const $ = id => document.getElementById(id);
PASSAGES.forEach((p, i) => {
  p.id = `w${p.week}-${i}`;
  p.sentences = p.text.filter(x => x !== "cut").flat();
  p.questions.forEach(q => {
    q.ev = p.sentences.map((s, i) => q.evidence.some(e => s.includes(e)) ? i : -1).filter(i => i >= 0);
    q.evidence.forEach(e => { if (!p.sentences.some(s => s.includes(e))) console.warn(`Evidence phrase not found in "${p.title}":`, e); });
  });
});
const WEEKS = [...new Set(PASSAGES.map(p => p.week))].sort((a, b) => a - b);

// ---------- saved progress (this device only) ----------
let S = {week: WEEKS[0], evidence: true, best: {}};
try { const s = JSON.parse(localStorage.getItem("readingGame") || "null"); if (s) S = {...S, ...s}; } catch (e) {}
if (!WEEKS.includes(S.week)) S.week = WEEKS[0];
const save = () => { try { localStorage.setItem("readingGame", JSON.stringify(S)); } catch (e) {} };

// ---------- text helpers ----------
function smart(s){
  return s.replace(/(^|[\s(\[—–-])"/g, "$1\u201C").replace(/"/g, "\u201D")
          .replace(/(^|[\s(\[—–-])'(?!em\b)/g, "$1\u2018").replace(/'/g, "\u2019");
}
function rich(el, s){ // *word* -> italics
  smart(s).split("*").forEach((part, i) => {
    if (!part) return;
    if (i % 2) { const em = document.createElement("em"); em.textContent = part; el.appendChild(em); }
    else el.appendChild(document.createTextNode(part));
  });
  return el;
}
const make = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) rich(e, text); return e; };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// ---------- screens ----------
function show(name){
  ["home", "read", "done"].forEach(n => $(n).hidden = n !== name);
  $("app").classList.toggle("fixed", name === "read");
  $("backBtn").hidden = name === "home";
  if (name === "home") $("title").textContent = "11+ Reading";
  window.scrollTo(0, 0);
}

function renderHome(){
  const seg = $("weekSeg"); seg.innerHTML = "";
  seg.appendChild(make("span", "lbl", "Week"));
  WEEKS.forEach(w => {
    const b = make("button", "", String(w)); b.type = "button";
    b.setAttribute("aria-label", `Week ${w}`);
    b.setAttribute("aria-pressed", String(S.week === w));
    b.onclick = () => { S.week = w; save(); renderHome(); };
    seg.appendChild(b);
  });
  $("evSwitch").setAttribute("aria-checked", String(S.evidence));
  const cards = $("cards"); cards.innerHTML = "";
  PASSAGES.filter(p => p.week === S.week).forEach(p => {
    const b = make("button", "pcard"); b.type = "button";
    if (p.bonus) b.append(make("span", "tagb", "Bonus"));
    b.append(make("span", "t", p.title), make("span", "s", p.source));
    const best = S.best[p.id];
    b.append(make("span", "b" + (best ? " done" : ""), best ? `Best: ${best.score} / ${best.max}` : "Not tried yet"));
    b.onclick = () => openPassage(p);
    cards.appendChild(b);
  });
  $("hint").textContent = S.evidence
    ? "For each question, pick an answer, then tap the sentence in the text that proves it. You score a point for each."
    : "Pick an answer for each question. Turn on \u201CFind the evidence\u201D to practise proving your answers from the text.";
  show("home");
}
$("evSwitch").onclick = () => { S.evidence = !S.evidence; save(); renderHome(); };
$("backBtn").onclick = () => renderHome();

// ---------- a passage ----------
let P = null, qi = 0, order = [], chosen = null, picked = null, results = [], stage = "";

function openPassage(p){
  P = p; qi = 0; results = [];
  $("title").textContent = p.title;
  $("intro").textContent = smart(p.intro);
  $("src").textContent = p.source;
  const t = $("text"); t.innerHTML = "";
  let n = 0;
  p.text.forEach(par => {
    if (par === "cut") { t.appendChild(make("p", "cut", "[\u2026]")); return; }
    const el = document.createElement("p");
    par.forEach((s, j) => {
      const span = make("span", "s", s); span.dataset.i = n++;
      span.onclick = () => pickSentence(+span.dataset.i);
      el.appendChild(span);
      if (j < par.length - 1) el.appendChild(document.createTextNode(" "));
    });
    t.appendChild(el);
  });
  show("read");
  $("pane").scrollTop = 0;
  stage = "intro";
  $("panel").hidden = true; $("panel").innerHTML = "";
  $("startRow").hidden = false;
  $("startBtn").textContent = `I've read it: start the questions (${p.questions.length})`;
}
$("startBtn").onclick = () => { $("startRow").hidden = true; $("panel").hidden = false; ask(); };

function clearMarks(){
  document.querySelectorAll("#text .s").forEach(s => s.classList.remove("picked", "ev", "wrongpick"));
  $("text").classList.remove("picking");
}

function header(q){
  const m = make("div", "meta");
  m.append(make("span", "", `Question ${qi + 1} of ${P.questions.length}`), make("span", "pill", q.type));
  return m;
}

function ask(){
  clearMarks();
  stage = "answer"; chosen = null; picked = null;
  const q = P.questions[qi];
  order = shuffle(q.options);
  const panel = $("panel"); panel.innerHTML = "";
  panel.append(header(q), make("p", "q", q.q));
  const opts = make("div", "opts");
  order.forEach((o, i) => {
    const b = make("button", "opt"); b.type = "button";
    b.append(make("span", "k", "ABCD"[i]), make("span", "", o.text));
    b.onclick = () => choose(i);
    opts.appendChild(b);
  });
  panel.appendChild(opts);
  panel.scrollTop = 0;
}

function choose(i){
  if (stage !== "answer") return;
  chosen = order[i];
  if (S.evidence) askEvidence(); else reveal();
}

function askEvidence(){
  stage = "evidence";
  const q = P.questions[qi];
  const panel = $("panel"); panel.innerHTML = "";
  panel.append(header(q), make("p", "recap", q.q));
  const mine = make("p", "mine"); mine.append(document.createTextNode("Your answer: ")); mine.appendChild(rich(document.createElement("b"), chosen.text));
  panel.append(mine, make("p", "instr", "Now tap the sentence in the text that best proves your answer."));
  const row = make("div", "btnrow");
  const back = make("button", "secondary", "Change answer"); back.type = "button"; back.onclick = () => ask();
  const check = make("button", "primary", "Check"); check.type = "button"; check.id = "checkBtn"; check.disabled = true;
  check.onclick = () => reveal();
  row.append(back, check); panel.appendChild(row);
  $("text").classList.add("picking");
}

function pickSentence(i){
  if (stage !== "evidence") return;
  picked = i;
  document.querySelectorAll("#text .s").forEach(s => s.classList.toggle("picked", +s.dataset.i === i));
  $("checkBtn").disabled = false;
}

// The four answers as they were shown (A–D), with the right one and the child's pick marked.
function reviewOptions(opts, mine, label){
  const d = document.createElement("details"); d.className = "review";
  d.appendChild(make("summary", "", label));
  const list = make("div", "opts");
  opts.forEach((o, i) => {
    const isMine = o === mine;
    const row = make("div", "opt static" + (o.correct ? " correct" : isMine ? " incorrect" : " dim"));
    row.appendChild(make("span", "k", "ABCD"[i]));
    const t = make("span", "", o.text);
    if (o.correct) t.appendChild(make("span", "tag", isMine ? "Right answer: you chose this" : "Right answer"));
    else if (isMine) t.appendChild(make("span", "tag", "You chose this"));
    row.appendChild(t);
    list.appendChild(row);
  });
  d.appendChild(list);
  return d;
}

function reveal(){
  stage = "reveal";
  const q = P.questions[qi];
  const right = chosen.correct === true;
  const evRight = S.evidence ? q.ev.includes(picked) : null;
  results.push({answer: right, evidence: evRight, chosen, order});

  $("text").classList.remove("picking");
  document.querySelectorAll("#text .s").forEach(s => {
    const i = +s.dataset.i;
    s.classList.remove("picked");
    if (q.ev.includes(i)) s.classList.add("ev");
    if (S.evidence && i === picked && !q.ev.includes(i)) s.classList.add("wrongpick");
  });
  const first = document.querySelector("#text .s.ev");
  if (first) first.scrollIntoView({block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});

  const panel = $("panel"); panel.innerHTML = "";
  panel.append(header(q), make("p", "recap", q.q));
  const v = make("div", "verdicts");
  v.append(make("span", "vp " + (right ? "y" : "n"), right ? "Answer: correct" : "Answer: not quite"));
  if (S.evidence) v.append(make("span", "vp " + (evRight ? "y" : "n"), evRight ? "Evidence: spot on" : "Evidence: not quite"));
  panel.appendChild(v);
  const correct = q.options.find(o => o.correct);
  if (!right){
    const w1 = make("p", "why"); w1.append(make("span", "lbl", `You chose: ${chosen.text}`)); rich(w1, chosen.why); panel.appendChild(w1);
  }
  const w2 = make("p", "why"); w2.append(make("span", "lbl strong", `${right ? "" : "The answer: "}${correct.text}`)); rich(w2, correct.why); panel.appendChild(w2);
  panel.appendChild(reviewOptions(order, chosen, "Show all four answers"));
  panel.append(make("p", "evnote", S.evidence && !evRight
    ? "The best evidence is highlighted in yellow in the text. The sentence you picked is outlined in red."
    : "The evidence is highlighted in yellow in the text."));
  const row = make("div", "btnrow");
  const last = qi + 1 >= P.questions.length;
  const next = make("button", "primary", last ? "See my score" : "Next question"); next.type = "button";
  next.onclick = () => { if (last) finish(); else { qi++; ask(); } };
  row.appendChild(next); panel.appendChild(row);
  panel.scrollTop = 0;
  next.focus({preventScroll: true});
}

function finish(){
  const max = results.length * (S.evidence ? 2 : 1);
  const score = results.reduce((t, r) => t + (r.answer ? 1 : 0) + (r.evidence ? 1 : 0), 0);
  const prev = S.best[P.id];
  if (!prev || score / max > prev.score / prev.max || (score / max === prev.score / prev.max && max > prev.max)) { S.best[P.id] = {score, max}; save(); }
  const answers = results.filter(r => r.answer).length;
  const evidence = results.filter(r => r.evidence).length;

  const d = $("done"); d.innerHTML = "";
  const box = make("div", "res");
  box.append(make("p", "sub", P.title), make("p", "big", `${score} / ${max}`));
  box.append(make("p", "sub", S.evidence
    ? `${answers} of ${results.length} answers right, and ${evidence} of ${results.length} pieces of evidence found.`
    : `${answers} of ${results.length} answers right.`));
  const ul = make("ul", "qlist");
  P.questions.forEach((q, i) => {
    const li = document.createElement("li");
    const mk = make("span", "marks");
    mk.append(make("span", "mk " + (results[i].answer ? "y" : "n"), results[i].answer ? "Answer ✓" : "Answer ✗"));
    if (S.evidence) mk.append(make("span", "mk " + (results[i].evidence ? "y" : "n"), results[i].evidence ? "Evidence ✓" : "Evidence ✗"));
    li.append(make("span", "", q.q), mk);
    li.appendChild(reviewOptions(results[i].order, results[i].chosen, "Show the answers"));
    ul.appendChild(li);
  });
  box.appendChild(ul);
  const row = make("div", "btnrow");
  const again = make("button", "secondary", "Try this one again"); again.type = "button"; again.onclick = () => openPassage(P);
  const list = PASSAGES.filter(p => p.week === P.week);
  const nextP = list[list.indexOf(P) + 1];
  const next = make("button", "primary", nextP ? `Next: ${nextP.title}` : `Back to Week ${P.week}`); next.type = "button";
  next.onclick = () => nextP ? openPassage(nextP) : renderHome();
  row.append(again, next); box.appendChild(row);
  d.appendChild(box);
  show("done");
  $("title").textContent = "Your score";
}

// ---------- keyboard ----------
document.addEventListener("keydown", e => {
  if ($("read").hidden) return;
  const k = e.key.toUpperCase();
  if (stage === "answer" && "ABCD1234".includes(k) && k.length === 1){ choose("ABCD1234".indexOf(k) % 4); e.preventDefault(); }
});

// ---------- full screen (shown only where supported, e.g. Chrome on Android) ----------
const fs = $("fsBtn");
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
if (document.fullscreenEnabled || document.webkitFullscreenEnabled) fs.hidden = false;
fs.onclick = () => {
  try {
    if (fsEl()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else { const el = document.documentElement; const r = (el.requestFullscreen || el.webkitRequestFullscreen).call(el); if (r && r.catch) r.catch(() => {}); }
  } catch (e) {}
};
function fsSync(){ const on = !!fsEl(); fs.classList.toggle("on", on); fs.setAttribute("aria-label", on ? "Exit full screen" : "Full screen"); fs.title = on ? "Exit full screen" : "Full screen"; }
document.addEventListener("fullscreenchange", fsSync);
document.addEventListener("webkitfullscreenchange", fsSync);

renderHome();
</script>
